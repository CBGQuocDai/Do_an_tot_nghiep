# Deploy toàn bộ ứng dụng (backend, frontend, image automation, webhook receiver)
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./gitops/apps/prod
  prune: true
  wait: true
  timeout: 5m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  # Giải mã các file *.sops.yaml bằng age key lưu trong secret flux-system/sops-age
  decryption:
    provider: sops
    secretRef:
      name: sops-age
