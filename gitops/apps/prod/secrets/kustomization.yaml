# Toàn bộ file ở đây sinh bằng gitops/scripts/seal-secrets.sh — không sửa tay.
# Flux giải mã cả file *.sops.yaml lẫn file .env/.json dùng trong secretGenerator.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - harbor-pull.sops.yaml
  - harbor-pull-flux.sops.yaml
  - webhook-token.sops.yaml
generatorOptions:
  disableNameSuffixHash: true
secretGenerator:
  # Mã hoá từ DA_Backend/.env
  - name: backend-env
    namespace: do-an
    envs:
      - backend.sops.env
  # Mã hoá từ DA_Backend/gcloud.json
  - name: gcp-credentials
    namespace: do-an
    files:
      - gcloud.json=gcloud.sops.json
