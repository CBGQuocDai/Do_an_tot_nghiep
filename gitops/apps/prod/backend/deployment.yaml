apiVersion: apps/v1
kind: Deployment
metadata:
  name: da-backend
  namespace: do-an
  labels:
    app.kubernetes.io/name: da-backend
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: da-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: da-backend
    spec:
      imagePullSecrets:
        - name: harbor-pull
      containers:
        - name: backend
          # Tag do ImageUpdateAutomation tự cập nhật theo marker $imagepolicy, không sửa tay
          image: registry.daidq.io.vn/do_an/da-backend:0db5726-6 # {"$imagepolicy": "flux-system:da-backend"}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /var/secrets/gcp/gcloud.json
          envFrom:
            - secretRef:
                name: backend-env
          volumeMounts:
            - name: gcp-credentials
              mountPath: /var/secrets/gcp
              readOnly: true
          # Spring Boot tự bật nhóm liveness/readiness khi chạy trong Kubernetes
          startupProbe:
            httpGet:
              path: /api/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /api/health/liveness
              port: http
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/health/readiness
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1Gi
      volumes:
        - name: gcp-credentials
          secret:
            secretName: gcp-credentials
