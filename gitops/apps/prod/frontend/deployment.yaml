apiVersion: apps/v1
kind: Deployment
metadata:
  name: da-frontend
  namespace: do-an
  labels:
    app.kubernetes.io/name: da-frontend
spec:
  replicas: 1
  revisionHistoryLimit: 3
  # hostPort chỉ 1 pod giữ được → tắt pod cũ trước rồi mới tạo pod mới
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: da-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: da-frontend
    spec:
      imagePullSecrets:
        - name: harbor-pull
      containers:
        - name: frontend
          # Tag do ImageUpdateAutomation tự cập nhật theo marker $imagepolicy, không sửa tay
          image: registry.daidq.io.vn/do_an/da-frontend:7b6c41c-1793177896 # {"$imagepolicy": "flux-system:da-frontend"}
          ports:
            - name: http
              containerPort: 3000
              # Giống docker -p 3000:3000 → Cloudflare Tunnel trỏ da.daidq.io.vn tới localhost:3000
              hostPort: 3000
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
